name: Build & Draft Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          chmod +x gradlew
          # Debug APK: signed with the debug key, installs on any device.
          ./gradlew assembleDebug --stacktrace

      - name: Collect APK
        run: |
          mkdir -p upload
          APK=$(find app/build/outputs/apk -name '*.apk' | head -n 1)
          if [ -z "$APK" ]; then echo "No APK produced"; exit 1; fi
          VER="${GITHUB_REF_NAME:-dev}"
          cp "$APK" "upload/ThermalMonitor-Snapdragon-${VER}.apk"
          ls -la upload

      - name: Release notes from CHANGELOG
        run: |
          VER="${GITHUB_REF_NAME#v}"
          awk -v v="$VER" '
            $0 ~ "^## \\[?"v"\\]?" {on=1; next}
            on && /^## / {exit}
            on {print}
          ' CHANGELOG.md > notes.md
          [ -s notes.md ] || cp CHANGELOG.md notes.md

      - name: Draft release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: ${{ github.ref_name }}
          body_path: notes.md
          files: upload/*
          fail_on_unmatched_files: true

      - name: Upload artifact (manual runs)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: upload/*

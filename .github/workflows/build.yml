name: Build & Draft Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode keystore (if secrets are set)
        id: decode_keystore
        run: |
          if [ -n "${{ secrets.SIGNING_KEYSTORE_BASE64 }}" ]; then
            echo "SIGNING_KEYSTORE_BASE64=${{ secrets.SIGNING_KEYSTORE_BASE64 }}" >> $GITHUB_ENV
            echo "has_keystore=true" >> $GITHUB_OUTPUT
          else
            echo "has_keystore=false" >> $GITHUB_OUTPUT
          fi

      - name: Build with Gradle (signed)
        if: steps.decode_keystore.outputs.has_keystore == 'true'
        run: ./gradlew assembleRelease
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}

      - name: Build with Gradle (debug fallback)
        if: steps.decode_keystore.outputs.has_keystore == 'false'
        run: ./gradlew assembleDebug

      - name: Determine tag and APK name
        id: apk_name
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if [ "${{ steps.decode_keystore.outputs.has_keystore }}" = "true" ]; then
            APK_NAME="ThermalMonitor-Snapdragon-${TAG}.apk"
          else
            APK_NAME="ThermalMonitor-Snapdragon-${TAG}-debug.apk"
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "apk_name=${APK_NAME}" >> $GITHUB_OUTPUT

      - name: Move APK to upload dir
        run: |
          mkdir -p upload
          if [ "${{ steps.decode_keystore.outputs.has_keystore }}" = "true" ]; then
            cp app/build/outputs/apk/release/app-release-unsigned.apk "upload/${{ steps.apk_name.outputs.apk_name }}" 2>/dev/null || \
            cp app/build/outputs/apk/release/app-release.apk "upload/${{ steps.apk_name.outputs.apk_name }}" 2>/dev/null || true
          else
            cp app/build/outputs/apk/debug/app-debug.apk "upload/${{ steps.apk_name.outputs.apk_name }}"
          fi

      - name: Create Draft Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          tag_name: ${{ steps.apk_name.outputs.tag }}
          name: "Thermal Monitor Snapdragon ${{ steps.apk_name.outputs.tag }}"
          body_path: CHANGELOG.md
          files: upload/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
